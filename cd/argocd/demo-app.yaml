apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-java-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/farahboukesra/devops-project.git
    targetRevision: main
    path: helm/app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
